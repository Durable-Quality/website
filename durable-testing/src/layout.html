<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{seoTitle}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<link rel="alternate" type="text/markdown" href="{{mdUrl}}" title="Markdown">
<link rel="alternate" type="text/plain" href="{{baseUrl}}/llms.txt" title="llms.txt">
<link rel="icon" type="image/png" href="{{base}}/assets/logo.png">
<meta name="theme-color" content="#fafbfc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="{{ogType}}">
<meta property="og:site_name" content="Durable Testing">
<meta property="og:title" content="{{ogTitle}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{baseUrl}}/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@DurableQA">
<script type="application/ld+json">{{jsonLd}}</script>
<script>try{var t=localStorage.getItem("durable-testing-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);var a=localStorage.getItem("durable-testing-accent");if(a&&a!=="mono")document.documentElement.setAttribute("data-accent",a)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Kalam:wght@400;700&display=swap">
<link rel="stylesheet" href="{{base}}/assets/site.css?v={{version}}">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/" aria-label="Durable Quality home">
      <span class="brand-name">Durable Quality</span>
    </a>
    <div class="top-actions">
      <div class="split">
        <button class="btn" id="copy-page" type="button" aria-label="Copy page as Markdown">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8.5" y="8.5" width="12" height="12" rx="2.5"/><path d="M15.5 8.5V6a2.5 2.5 0 0 0-2.5-2.5H6A2.5 2.5 0 0 0 3.5 6v7A2.5 2.5 0 0 0 6 15.5h2.5"/></svg>
          <span class="copy-label">Copy page</span>
        </button>
        <button class="btn btn-icon" id="menu-toggle" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="page-menu" aria-label="More Markdown options">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="menu" id="page-menu" role="menu" hidden>
          <button type="button" role="menuitem" data-action="copy-page">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8.5" y="8.5" width="12" height="12" rx="2.5"/><path d="M15.5 8.5V6a2.5 2.5 0 0 0-2.5-2.5H6A2.5 2.5 0 0 0 3.5 6v7A2.5 2.5 0 0 0 6 15.5h2.5"/></svg>
            <span><b>Copy page</b><small>This page as Markdown, ready for an LLM or agent</small></span>
          </button>
          <button type="button" role="menuitem" data-action="copy-rules">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><path d="m3.5 6.5 1.2 1.2 2-2.2M3.5 12l1.2 1.2 2-2.2M3.5 17.5l1.2 1.2 2-2.2"/></svg>
            <span><b>Copy all rules</b><small>Every section's rules in one block, ready for AGENTS.md or CLAUDE.md</small></span>
          </button>
          <a role="menuitem" href="{{mdPath}}" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3.5H7A2.5 2.5 0 0 0 4.5 6v12A2.5 2.5 0 0 0 7 20.5h10a2.5 2.5 0 0 0 2.5-2.5V9Z"/><path d="M14 3.5V9h5.5M8.5 13h7M8.5 16.5h5"/></svg>
            <span><b>View as Markdown</b><small>Open this page as plain Markdown</small></span>
          </a>
          <a role="menuitem" href="{{claudeUrl}}" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 4.5h6v6M19.5 4.5 11 13M17 14v4.5a1.5 1.5 0 0 1-1.5 1.5h-10A1.5 1.5 0 0 1 4 18.5v-10A1.5 1.5 0 0 1 5.5 7H10"/></svg>
            <span><b>Open in Claude</b><small>Ask questions about this page</small></span>
          </a>
          <a role="menuitem" href="{{chatgptUrl}}" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 4.5h6v6M19.5 4.5 11 13M17 14v4.5a1.5 1.5 0 0 1-1.5 1.5h-10A1.5 1.5 0 0 1 4 18.5v-10A1.5 1.5 0 0 1 5.5 7H10"/></svg>
            <span><b>Open in ChatGPT</b><small>Ask questions about this page</small></span>
          </a>
        </div>
      </div>
      <div class="pop-wrap">
        <button class="btn" id="accent-toggle" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="accent-pop" aria-label="Accent colour" title="Accent colour"><span class="sw sw-current"></span></button>
        <div class="menu accent-pop" id="accent-pop" hidden>
          <p class="pop-label">Accent colour</p>
          <div class="sw-grid">
            <button type="button" data-accent-set="ink" aria-pressed="false"><span class="sw" style="--l:#1c64c4;--d:#6eaaf5"></span>Ink</button>
            <button type="button" data-accent-set="violet" aria-pressed="false"><span class="sw" style="--l:#6741d9;--d:#a99bff"></span>Violet</button>
            <button type="button" data-accent-set="teal" aria-pressed="false"><span class="sw" style="--l:#0f766e;--d:#4fd1c5"></span>Teal</button>
            <button type="button" data-accent-set="ember" aria-pressed="false"><span class="sw" style="--l:#c2410c;--d:#fb923c"></span>Ember</button>
            <button type="button" data-accent-set="rose" aria-pressed="false"><span class="sw" style="--l:#be185d;--d:#f472b6"></span>Rose</button>
            <button type="button" data-accent-set="mono" aria-pressed="true"><span class="sw" style="--l:#141821;--d:#e7e9ee"></span>Mono</button>
          </div>
        </div>
      </div>
      <div class="theme" role="group" aria-label="Color theme">
        <button type="button" data-theme-set="light" aria-pressed="false" aria-label="Light theme" title="Light">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
        </button>
        <button type="button" data-theme-set="system" aria-pressed="true" aria-label="Match system theme" title="System">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M8.5 20h7M12 16.5V20"/></svg>
        </button>
        <button type="button" data-theme-set="dark" aria-pressed="false" aria-label="Dark theme" title="Dark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>
        </button>
      </div>
    </div>
  </div>
</header>

<div class="shell">
  <aside class="rail">
    <p class="rail-label">Durable Testing</p>
    <nav class="toc" id="toc" aria-label="Guide">
{{nav}}
    </nav>
  </aside>

  <main class="content" id="top">
    <details class="mobile-toc"><summary>Contents</summary><nav class="toc" id="toc-mobile" aria-label="Guide"></nav></details>
    <article class="doc" data-page="{{slug}}">
{{content}}
    </article>
{{pager}}
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg><span></span></div>

<div class="viewer" id="viewer" hidden>
  <div class="viewer-card" role="dialog" aria-modal="true" aria-labelledby="viewer-title">
    <div class="viewer-head">
      <p id="viewer-title">Markdown<small id="viewer-sub">Copying is blocked here</small></p>
      <button class="btn" type="button" id="viewer-close" aria-label="Close">Close</button>
    </div>
    <textarea id="viewer-text" readonly aria-label="Markdown"></textarea>
  </div>
</div>

<!-- Canonical Markdown for this page and for all agent rules. Also served at {{mdUrl}} and {{baseUrl}}/rules.md -->
<script type="text/markdown" id="md-page">
{{pageMd}}
</script>
<script type="text/markdown" id="md-rules">
{{rulesMd}}
</script>
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js" defer></script>
<script src="{{base}}/assets/site.js?v={{version}}" defer></script>
<!-- Durable Quality's site analytics, the same as on the landing page (app/layout.tsx). -->
<script src="https://cdn.databuddy.cc/databuddy.js" data-client-id="e7c719eb-7a7e-4c0e-9544-e6f7e9d9d4d4" data-track-web-vitals="true" crossorigin="anonymous" async></script>
</body>
</html>
