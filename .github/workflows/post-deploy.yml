name: Post-deploy

# Runs the routing tests against the live site after each production deploy.
# Vercel reports its deployments to GitHub, which fires deployment_status.
on:
  deployment_status:

jobs:
  routing:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Checks out the deployed commit, so the guide built here matches the
      # one that was deployed.
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - run: bun install --frozen-lockfile

      - name: Routing tests
        run: bun run test:routing
        env:
          ROUTING_BASE_URL: https://durableqa.xyz
