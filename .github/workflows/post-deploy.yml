name: Post-deploy

# Smoke-tests the live site after each production deploy.
# Vercel reports its deployments to GitHub, which fires deployment_status.
on:
  deployment_status:

jobs:
  smoke:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      # No install or build: the smoke test only makes requests.
      - name: Smoke test
        run: bun run test:smoke
        env:
          SMOKE_BASE_URL: https://durableqa.xyz
