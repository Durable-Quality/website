name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - run: bun install --frozen-lockfile

      # Also runs Durable Testing's build checks (em dashes, .md and .html
      # headings), which stop the build on failure.
      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        if: hashFiles('tests/**/*.test.ts') != ''
        run: bun test
